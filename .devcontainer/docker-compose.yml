version: "3.7"
services:
  mariadb:
    image: docker.io/mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
      # E119/Tuning 29.08.2026: Die Importdatenbank ist rund 4 GB gross, der
      # Vorgabe-Puffer 128 MB -- 3 % passten in den Speicher. Jede Transaktion
      # ging auf die Platte, blieb dadurch laenger offen und kollidierte oefter
      # mit den parallelen Abschnitten. Groesster Einzelhebel fuer Tempo *und*
      # Verklemmungen.
      - --innodb-buffer-pool-size=2G
      # Kein fsync bei jedem Commit. Auf einer Entwicklungsinstanz unbedenklich
      # (Risiko nur bei Absturz des Wirtssystems), vor Produktion zurueck auf 1.
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: docker.io/redis:alpine
    # tmpfs is used to avoid issues with Redis persistence in development
    tmpfs:
      - /data

  frappe:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
    volumes:
      - frappe_docker_volume:/workspace:cached
      - frappe_sites:/home/frappe/frappe-bench/sites
      - frappe_logs:/home/frappe/frappe-bench/logs
      - ..:/workspace/development/host-repo:uid=$(id -u),gid=$(id -g)
      - ~/.ssh:/home/frappe/.ssh-mount
      - /var/run/docker.sock:/var/run/docker.sock
      - ./README.md:/workspace/development/README.md:cached
    working_dir: /workspace/development
    ports:
      - 8000-8005:8000-8005
      - 9000-9005:9000-9005

volumes:
  mariadb-data:
  frappe_docker_volume:
    driver: local
  frappe_sites:
    driver: local
  frappe_logs:
    driver: local
